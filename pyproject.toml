[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rubiks-cube-vision"
version = "0.2.0"
description = "Reproducible experiments for camera-based Rubik's Cube state reconstruction"
requires-python = ">=3.10"
dependencies = ["kociemba>=1.2.1", "numpy>=1.24", "opencv-python>=4.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
research = ["scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7", "PyYAML>=6"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cube", "input_handler", "main", "moves", "playback", "solver", "validation", "visualizer"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
